<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>FIST OF EIGHT</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center;

  canvas { display: block; background: #05050a; image-rendering: auto; touch-action: none; }
  #rotate { display: none; position: fixed; inset: 0; background: #05050a; color: #fff; z-index: 10;
    align-items: center; justify-content: center; flex-direction: column; font: bold 20px "Yu Gothic", "Hiragino Sans", sans-serif; text-align: center; }
  #rotate .icon { font-size: 64px; margin-bottom: 16px; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<div id="rotate"><div class="icon">📱↻</div>スマホを横向きにしてください</div>
